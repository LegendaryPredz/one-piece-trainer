name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 6 * * *' }] # daily, so the field data stays current
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Limitless can be down or rate limited; fall back to the committed meta.json
      - run: node scripts/refresh-data.mjs --meta-only || echo "meta refresh failed, using committed data"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
